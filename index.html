  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: #000000;
      color: #f4f4f5;
      touch-action: manipulation;
      overscroll-behavior-y: none;
    }

    .card-btn {
      transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.12s ease, border-color 0.12s ease;
      position: relative;
      overflow: hidden;
      touch-action: none; /* crucial for touch gestures without scrolling */
    }

    .card-btn:active, .card-btn.pressed {
      transform: scale(0.95);
      background-color: #27272a !important;
      border-color: rgba(255, 255, 255, 0.25) !important;
    }

    .card-btn.cancelling {
      border-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.15) !important;
      transform: scale(0.92) !important;
    }

    .segment-btn {
      transition: all 0.15s ease;
    }

    .segment-btn.active {
      background: #ffffff !important;
      color: #000000 !important;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.25);
    }

    .recording-wave {
      display: inline-block;
      width: 3px;
      height: 14px;
      background: #ef4444;
      border-radius: 2px;
      margin: 0 1.5px;
      animation: wave 0.7s ease-in-out infinite alternate;
    }

    @keyframes wave {
      0% { height: 4px; opacity: 0.4; }
      100% { height: 20px; opacity: 1; }
    }

    /* Modal slide animation */
    .modal-enter {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Custom scroll for recent tasks */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>

class TickTickClient {
  constructor(token) {
    this.token = token || this.getToken();
  }

  getToken() {
    // 1. Check URL hash (e.g. #token=tp_...)
    if (typeof window !== 'undefined' && window.location.hash) {
      const match = window.location.hash.match(/token=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        const t = match[1];
        localStorage.setItem('ticktick_token', t);
        history.replaceState(null, null, window.location.pathname);
        return t;
      }
    }
    // 2. Read from localStorage
    if (typeof localStorage !== 'undefined') {
      const stored = localStorage.getItem('ticktick_token');
      if (stored) return stored;
    }
    // 3. Fallback: no token configured yet
    return null;
  }

  setToken(token) {
    this.token = token;
    if (typeof localStorage !== 'undefined') {
      localStorage.setItem('ticktick_token', token);
    }
  }

  getHeaders() {
    return {
      'Authorization': `Bearer ${this.token}`,
      'Content-Type': 'application/json',
      'User-Agent': 'VoiceTaskPWA/1.0'
    };
  }

  /**
   * Create a task directly in TickTick
   */
  async createTask({ categoryKey, columnIdx = 0, title, content = '', priority = 0, tags = [] }) {
    if (!this.token) {
      throw new Error('Токен TickTick не задан. Нажмите ⚙️ для настройки.');
    }
    const projMeta = TICKTICK_CONFIG.projects[categoryKey] || TICKTICK_CONFIG.projects['4-Разное'];
    const projectId = projMeta.id;
    
    // Resolve columnId from pre-cached map
    const projectCols = TICKTICK_CONFIG.columnMap[projectId] || {};
    const columnId = projectCols[columnIdx] || null;

    const payload = {
      title: title.trim(),
      projectId: projectId,
      priority: priority // 0, 3, or 5
    };

    if (columnId) {
      payload.columnId = columnId;
    }

    if (content) {
      payload.content = content;
    }

    if (tags && tags.length > 0) {
      payload.tags = tags;
    }

    const response = await fetch(`${TICKTICK_CONFIG.apiBase}/task`, {
      method: 'POST',
      headers: this.getHeaders(),
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`TickTick API error (${response.status}): ${errText}`);
    }

    return await response.json();
  }
}




/**
 * Russian Speech NLP Task Parser for Voice Task PWA
 * Parses columns, priorities, size tags, and cleans task titles
 * Supports real-time chronological switching (the last spoken command takes precedence)
 */

// Cleans up any stutter, duplicated words or repeated phrases (1-grams, N-grams, suffix echoes)
function cleanRecognizedText(str) {
  if (!str || typeof str !== 'string') return '';
  let tokens = str.trim().split(/\s+/);

  const norm = (w) => w.toLowerCase().replace(/^[.,!?:;"'«»—\-]+|[.,!?:;"'«»—\-]+$/g, '');

  // 1. Remove consecutive identical tokens (1-grams): 'собак собак' -> 'собак'
  let out = [];
  for (let i = 0; i < tokens.length; i++) {
    const currNorm = norm(tokens[i]);
    const prevNorm = i > 0 ? norm(tokens[i - 1]) : '';
    if (i > 0 && currNorm && currNorm === prevNorm) {
      continue;
    }
    out.push(tokens[i]);
  }
  tokens = out;

  // 2. Remove any repeated n-gram phrase of length k (from k = floor(len/2) down to 2)
  let changed = true;
  while (changed) {
    changed = false;
    const len = tokens.length;
    for (let k = Math.floor(len / 2); k >= 2; k--) {
      for (let i = 0; i <= len - 2 * k; i++) {
        let match = true;
        for (let j = 0; j < k; j++) {
          if (norm(tokens[i + j]) !== norm(tokens[i + k + j])) {
            match = false;
            break;
          }
        }
        if (match) {
          tokens.splice(i + k, k);
          changed = true;
          break;
        }
      }
      if (changed) break;
    }
  }

  // 3. Suffix echo check: if the end of the tokens matches ANY earlier multi-word slice
  for (let suffixLen = Math.floor(tokens.length / 2); suffixLen >= 2; suffixLen--) {
    const suffixNorm = tokens.slice(tokens.length - suffixLen).map(t => norm(t)).join(' ');
    const restNorm = tokens.slice(0, tokens.length - suffixLen).map(t => norm(t)).join(' ');
    if (restNorm.includes(suffixNorm) && suffixNorm.length > 0) {
      tokens = tokens.slice(0, tokens.length - suffixLen);
      break;
    }
  }

  return tokens.join(' ').trim();
}

    { tag: null,      pattern: /(?:^|[\s,.:;!?])(без размера|без метки|сбрось размер|нормальн[а-яё]*)(?=$|[\s,.:;!?])/gi }
  ],

  garbageWords: [
    /(?:^|[\s,.:;!?])(надо|нужно|необходимо|запиши|добавь|пометь|напомни|короче|слушай|эээ|ну|так|в общем|а нет|нет|хотя)(?=$|[\s,.:;!?])/gi
  ],

  // Remove leading category words like "купить" if dictated inside the "6-Купить" project
  categoryPrefixes: [
    /(?:^|[\s,.:;!?])(купить|покупка|вайб|лиды|лабс|радар|тело|здоровье|роза|разное)(?=$|[\s,.:;!?])/gi
  ],

  cleanRecognizedText: cleanRecognizedText,

  parse(rawText, activeCategoryName = '') {
    if (!rawText || typeof rawText !== 'string') {
      return {
        title: '',
        columnIdx: null,
        priority: 0,
        priorityTag: null,
        sizeTag: null,
        tags: [],
        hasExplicitPriority: false,
        hasExplicitSize: false
      };
    }

    const textRaw = cleanRecognizedText(rawText.trim());

    // 1. Find all column occurrences and their positions (chronological order)
    const colOccurrences = [];
    for (const col of this.columns) {
      const rx = new RegExp(col.pattern.source, 'gi');
      let m;
      while ((m = rx.exec(textRaw)) !== null) {
        colOccurrences.push({ pos: m.index, val: col.idx });
      }
    }
    colOccurrences.sort((a, b) => a.pos - b.pos);
    const detectedCol = colOccurrences.length > 0 ? colOccurrences[colOccurrences.length - 1].val : null;

    // 2. Find all priority occurrences and their positions
    const prioOccurrences = [];
    for (const prio of this.priorities) {
      const rx = new RegExp(prio.pattern.source, 'gi');
      let m;
      while ((m = rx.exec(textRaw)) !== null) {
        prioOccurrences.push({ pos: m.index, priority: prio.priority, tag: prio.tag });
      }
    }
    prioOccurrences.sort((a, b) => a.pos - b.pos);
    const hasExplicitPriority = prioOccurrences.length > 0;
    const lastPrio = hasExplicitPriority ? prioOccurrences[prioOccurrences.length - 1] : { priority: 0, tag: null };

    // 3. Find all size occurrences and their positions
    const sizeOccurrences = [];
    for (const size of this.sizes) {
      const rx = new RegExp(size.pattern.source, 'gi');
      let m;
      while ((m = rx.exec(textRaw)) !== null) {
        sizeOccurrences.push({ pos: m.index, tag: size.tag });
      }
    }
    sizeOccurrences.sort((a, b) => a.pos - b.pos);
    const hasExplicitSize = sizeOccurrences.length > 0;
    const lastSizeTag = hasExplicitSize ? sizeOccurrences[sizeOccurrences.length - 1].tag : null;

    // 4. Strip all control words, garbage, and redundant category names to get clean task title
    let cleaned = textRaw;
    for (const col of this.columns) {
      cleaned = cleaned.replace(new RegExp(col.pattern.source, 'gi'), (m, word) => m.replace(word, ' '));
    }
    for (const prio of this.priorities) {
      cleaned = cleaned.replace(new RegExp(prio.pattern.source, 'gi'), (m, word) => m.replace(word, ' '));
    }
    for (const size of this.sizes) {
      cleaned = cleaned.replace(new RegExp(size.pattern.source, 'gi'), (m, word) => m.replace(word, ' '));
    }
    for (const gPattern of this.garbageWords) {
      cleaned = cleaned.replace(new RegExp(gPattern.source, 'gi'), (m, word) => m.replace(word, ' '));
    }
    for (const cPattern of this.categoryPrefixes) {
      cleaned = cleaned.replace(new RegExp(cPattern.source, 'gi'), (m, word) => m.replace(word, ' '));
    }

    cleaned = cleanRecognizedText(cleaned);
    cleaned = cleaned.replace(/\s+/g, ' ').trim();
    if (cleaned.length > 0) {
      cleaned = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);
    }

    const tags = [];
    if (lastPrio.tag) tags.push(lastPrio.tag);
    if (lastSizeTag) tags.push(lastSizeTag);

    return {
      title: cleaned,
      columnIdx: detectedCol,
      priority: lastPrio.priority,
      priorityTag: lastPrio.tag,
      sizeTag: lastSizeTag,
      tags: tags,
      hasExplicitPriority: hasExplicitPriority,
      hasExplicitSize: hasExplicitSize
    };
  }
};

/**
 * Web Speech API Engine wrapper for Voice Task PWA
 * Multi-segment Push-to-Talk with Android pause auto-restart and echo deduplication
 */

class SpeechEngine {
  constructor({ onStart, onInterim, onFinal, onError, onEnd }) {
    this.onStart = onStart || (() => {});
    this.onInterim = onInterim || (() => {});
    this.onFinal = onFinal || (() => {});
    this.onError = onError || (() => {});
    this.onEnd = onEnd || (() => {});

    this.currentRec = null;
    this.isPressing = false;
    this.savedSegments = [];
    this.activeSegment = '';
    this.restartTimeout = null;
    this.isFinalizing = false;
  }

  static cleanRecognizedText(str) {
    return cleanRecognizedText(str);
  }

  commitActiveSegment() {
    if (!this.activeSegment || !this.activeSegment.trim()) return;
    const chunk = this.activeSegment.trim();
    this.activeSegment = '';

    if (this.savedSegments.length > 0) {
      const last = this.savedSegments[this.savedSegments.length - 1];
      const lastLower = last.toLowerCase();
      const chunkLower = chunk.toLowerCase();

      // 1. If this chunk is identical or is a substring/echo of what was already saved
      if (lastLower === chunkLower || lastLower.endsWith(chunkLower) || lastLower.includes(chunkLower)) {
        return;
      }

      // 2. If this new chunk contains the previous chunk plus new words (cumulative)
      if (chunkLower.startsWith(lastLower) || chunkLower.includes(lastLower)) {
        this.savedSegments[this.savedSegments.length - 1] = chunk;
        return;
      }
    }

    this.savedSegments.push(chunk);
  }

  getCombinedTranscript() {
    const parts = [...this.savedSegments];
    if (this.activeSegment && this.activeSegment.trim()) {
      parts.push(this.activeSegment.trim());
    }
    return cleanRecognizedText(parts.join(' '));
  }

  start() {
    this.isPressing = true;
    this.savedSegments = [];
    this.activeSegment = '';
    this.isFinalizing = false;

    if (this.restartTimeout) {
      clearTimeout(this.restartTimeout);
      this.restartTimeout = null;
    }

    if (this.currentRec) {
      try {
        this.currentRec.onend = null;
        this.currentRec.onerror = null;
        this.currentRec.abort();
      } catch (e) {}
      this.currentRec = null;
    }

    this.startRecognitionSession();
  }

  startRecognitionSession() {
    if (!this.isPressing) return;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      console.warn("Web Speech API is not supported in this browser.");
      this.onError("Speech recognition not supported");
      return;
    }

    const rec = new SpeechRecognition();
    rec.lang = 'ru-RU';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onstart = () => {
      this.onStart();
      const currentText = this.getCombinedTranscript();
      if (currentText) {
        this.onInterim(currentText);
      }
    };

    rec.onresult = (event) => {
      let fullText = '';
      for (let i = 0; i < event.results.length; i++) {
        if (event.results[i] && event.results[i][0]) {
          fullText += event.results[i][0].transcript + ' ';
        }
      }
      this.activeSegment = fullText.trim();
      const combined = this.getCombinedTranscript();
      this.onInterim(combined);
    };

    rec.onerror = (event) => {
      console.warn("Speech recognition error:", event.error);
      if (event.error === 'not-allowed') {
        this.isPressing = false;
        this.onError('not-allowed');
        this.onEnd();
        return;
      }
      // Non-fatal errors like 'no-speech' will be handled on onend without aborting hold
    };

    rec.onend = () => {
      this.commitActiveSegment();
      this.currentRec = null;

      // MULTI-SEGMENT CONTINUATION:
      // If user is STILL holding the category button, Android speech paused after a word or silence.
      // Instantly restart listening for the remaining words without cutting off the user!
      if (this.isPressing) {
        const textSoFar = this.getCombinedTranscript();
        if (textSoFar) {
          this.onInterim(textSoFar);
        }
        this.restartTimeout = setTimeout(() => {
          if (this.isPressing) {
            this.startRecognitionSession();
          }
        }, 60);
      } else {
        this.finalizeRecording();
      }
    };

    this.currentRec = rec;
    try {
      rec.start();
    } catch (e) {
      console.warn("Error starting recognition, retrying:", e);
      if (this.isPressing) {
        this.restartTimeout = setTimeout(() => {
          if (this.isPressing) {
            try { rec.start(); } catch (err) {}
          }
        }, 100);
      }
    }
  }

  stop() {
    this.isPressing = false;

    if (this.restartTimeout) {
      clearTimeout(this.restartTimeout);
      this.restartTimeout = null;
    }

    if (this.currentRec) {
      try {
        this.currentRec.stop();
      } catch (e) {}
    }

    // Allow 220ms grace period for final onresult / onend event to commit
    setTimeout(() => {
      this.finalizeRecording();
    }, 220);
  }

  finalizeRecording() {
    if (this.isFinalizing) return;
    this.isFinalizing = true;
    setTimeout(() => { this.isFinalizing = false; }, 400);

    this.commitActiveSegment();

    const rawJoined = this.savedSegments.join(' ').trim();
    this.savedSegments = [];
    this.activeSegment = '';
    this.currentRec = null;

    const phrase = cleanRecognizedText(rawJoined);
    this.onFinal(phrase);
    this.onEnd();
  }

  abort() {
    this.isPressing = false;

    if (this.restartTimeout) {
      clearTimeout(this.restartTimeout);
      this.restartTimeout = null;
    }

    this.savedSegments = [];
    this.activeSegment = '';

    if (this.currentRec) {
      try {
        this.currentRec.onend = null;
        this.currentRec.onerror = null;
        this.currentRec.abort();
      } catch (e) {}
      this.currentRec = null;
    }

    this.onEnd();
  }
}

/**
 * Offline Task Queue Manager for Voice Task PWA
 * Stores failed/offline tasks in localStorage and syncs automatically
 */

class TaskQueue {
  constructor(tickTickClient, storageKey = 'voicetask_offline_queue') {
    this.client = tickTickClient;
    this.storageKey = storageKey;
    this.isSyncing = false;
    this.onQueueChanged = () => {};
  }

  getQueue() {
    try {
      if (typeof localStorage === 'undefined') return [];
      const data = localStorage.getItem(this.storageKey);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      console.error("Failed to read offline queue:", e);
      return [];
    }
  }

  saveQueue(items) {
    try {
      if (typeof localStorage === 'undefined') return;
      localStorage.setItem(this.storageKey, JSON.stringify(items));
      this.onQueueChanged(items.length);
    } catch (e) {
      console.error("Failed to save offline queue:", e);
    }
  }

  enqueue(taskPayload) {
    const queue = this.getQueue();
    const item = {
      ...taskPayload,
      id: 'local_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      createdAt: new Date().toISOString()
    };
    queue.push(item);
    this.saveQueue(queue);
    return item;
  }

  size() {
    return this.getQueue().length;
  }

  async syncAll() {
    if (this.isSyncing) return { synced: 0, failed: 0 };
    const queue = this.getQueue();
    if (queue.length === 0) return { synced: 0, failed: 0 };

    this.isSyncing = true;
    let synced = 0;
    let failed = 0;
    const remaining = [];

    for (const item of queue) {
      try {
        await this.client.createTask({
          categoryKey: item.categoryKey,
          columnIdx: item.columnIdx,
          title: item.title,
          content: item.content,
          priority: item.priority,
          tags: item.tags
        });
        synced++;
      } catch (err) {
        console.warn("Failed to sync queued task:", item.title, err);
        failed++;
        remaining.push(item);
      }
    }

    this.saveQueue(remaining);
    this.isSyncing = false;
    return { synced, failed, remaining: remaining.length };
  }
}

      else if (type === 'start') navigator.vibrate(40);
      else if (type === 'stop') navigator.vibrate(20);
      else if (type === 'success') navigator.vibrate([30, 40, 30]);
      else if (type === 'cancel') navigator.vibrate(80);
    }

    // State
    let activeCategory = '6-Купить';
    let activeCategoryIcon = '🛒';
    let selectedCol = 0;
    let selectedPrio = 0;
    let selectedPrioTag = null;
    let selectedSizeTag = null;
    let pendingTask = null;

    // Gesture tracking for Swipe to Cancel
    let touchStartX = 0;
    let touchStartY = 0;
    let isPressing = false;
    let isCancelled = false;
    let currentPressBtn = null;

    // TickTick & Queue
    const ticktick = new TickTickClient();
    const taskQueue = new TaskQueue(ticktick);

    function updateTokenStatus() {
      if (!ticktick.token) {
        document.getElementById('syncIndicator').className = 'w-1.5 h-1.5 rounded-full bg-amber-500 inline-block';
        document.getElementById('syncStatusText').innerText = 'Токен не задан (нажмите ⚙️)';
      } else {
        document.getElementById('syncIndicator').className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse';
        document.getElementById('syncStatusText').innerText = 'TickTick подключен';
      }
    }
    updateTokenStatus();

    taskQueue.onQueueChanged = (size) => {
      const badge = document.getElementById('queueBadge');
      if (size > 0) {
        badge.classList.remove('hidden');
        badge.innerText = '⏳ ' + size;
      } else {
        badge.classList.add('hidden');
      }
    };

    window.addEventListener('online', () => {
      document.getElementById('syncIndicator').className = 'w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block animate-pulse';
      document.getElementById('syncStatusText').innerText = 'TickTick подключен';
      taskQueue.syncAll();
    });

    window.addEventListener('offline', () => {
      document.getElementById('syncIndicator').className = 'w-1.5 h-1.5 rounded-full bg-amber-500 inline-block';
      document.getElementById('syncStatusText').innerText = 'Офлайн (сохраняю локально)';
    });

    // Speech Engine Setup
    const speech = new SpeechEngine({
      onStart: () => {
        document.getElementById('bannerIcon').innerText = '🔴';
        document.getElementById('bannerText').innerText = 'Слушаю... Назовите суть задачи';
        document.getElementById('waveBox').classList.remove('hidden');
        document.getElementById('liveBanner').classList.add('border-red-500/50', 'bg-red-500/10');
      },
      onInterim: (text) => {
        if (!text) return;
        document.getElementById('bannerText').innerText = text;

        // Live override on the fly (continuously reacts to every spoken command)
        try {
          const parsed = TaskParser.parse(text, activeCategory);
          if (parsed.columnIdx !== null) {
            setCol(parsed.columnIdx);
            triggerHaptic('tap');
          }
          if (parsed.hasExplicitPriority) {
            setPrio(parsed.priority, parsed.priorityTag);
            triggerHaptic('tap');
          }
          if (parsed.hasExplicitSize) {
            setSize(parsed.sizeTag);
            triggerHaptic('tap');
          }
        } catch (err) {
          console.warn("Parse error during interim:", err);
        }
      },
      onFinal: (fullText) => {
        if (isCancelled) return;
        handleRecordingComplete(fullText);
      },
      onError: (err) => {
        console.warn("Speech error:", err);
      },
      onEnd: () => {
        document.getElementById('waveBox').classList.add('hidden');
        document.getElementById('liveBanner').classList.remove('border-red-500/50', 'bg-red-500/10');
      }
    });

    // Push-to-Talk Bindings on the 8 Grid Buttons
    const buttons = document.querySelectorAll('.card-btn');
    buttons.forEach(btn => {
      const cat = btn.getAttribute('data-cat');
      const icon = btn.getAttribute('data-icon');

      const onPointerDown = (e) => {
        e.preventDefault();
        if (isPressing) return;
        isPressing = true;
        isCancelled = false;
        currentPressBtn = btn;
        activeCategory = cat;
        activeCategoryIcon = icon;

        try { btn.setPointerCapture(e.pointerId); } catch (err) {}

        const touch = e.touches ? e.touches[0] : e;
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;

        btn.classList.add('pressed');
        playBeep(700, 0.04);
        triggerHaptic('start');

        speech.start();
      };

      const onPointerMove = (e) => {
        if (!isPressing || isCancelled) return;
        const touch = e.touches ? e.touches[0] : e;
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;

        // If swiped left or up > 60px -> Cancel gesture!
        if (deltaX < -60 || deltaY < -60) {
          isCancelled = true;
          btn.classList.remove('pressed');
          btn.classList.add('cancelling');
          document.getElementById('bannerIcon').innerText = '🗑️';
          document.getElementById('bannerText').innerText = 'Отпустите для отмены';
          triggerHaptic('cancel');
        }
      };

      const onPointerUp = (e) => {
        if (!isPressing) return;
        e.preventDefault();
        try {
          if (btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
            btn.releasePointerCapture(e.pointerId);
          }
        } catch (err) {}

        isPressing = false;
        btn.classList.remove('pressed', 'cancelling');
        playBeep(500, 0.03);
        triggerHaptic('stop');

        if (isCancelled) {
          speech.abort();
          document.getElementById('bannerIcon').innerText = '👆';
          document.getElementById('bannerText').innerText = 'Запись отменена';
          setTimeout(() => {
            document.getElementById('bannerText').innerText = 'Зажмите категорию и назовите задачу';
          }, 1500);
        } else {
          speech.stop();
        }
      };

      // Pointer events with pointer capture for modern browsers & Android
      btn.addEventListener('pointerdown', onPointerDown);
      btn.addEventListener('pointermove', onPointerMove);
      btn.addEventListener('pointerup', onPointerUp);
      btn.addEventListener('pointercancel', onPointerUp);

      // Fallback touch events for environments without PointerEvent
      btn.addEventListener('touchstart', onPointerDown, { passive: false });
      btn.addEventListener('touchmove', onPointerMove, { passive: false });
      btn.addEventListener('touchend', onPointerUp, { passive: false });
      btn.addEventListener('touchcancel', onPointerUp, { passive: false });

      // Fallback mouse events
      btn.addEventListener('mousedown', onPointerDown);
      btn.addEventListener('mousemove', onPointerMove);
      btn.addEventListener('mouseup', onPointerUp);

      // Prevent mobile Chrome long-press context menu & ghost click
      btn.addEventListener('contextmenu', (e) => e.preventDefault());
      btn.addEventListener('click', (e) => e.preventDefault());
    });

    function handleRecordingComplete(rawText) {
      if (!rawText || rawText.trim().length === 0) {
        document.getElementById('bannerIcon').innerText = '👆';
        document.getElementById('bannerText').innerText = 'Речь не распознана. Попробуйте еще раз';
        return;
      }

      const parsed = TaskParser.parse(rawText, activeCategory);
      if (parsed.columnIdx !== null) {
        selectedCol = parsed.columnIdx;
        setCol(selectedCol);
      }
      if (parsed.hasExplicitPriority) {
        selectedPrio = parsed.priority;
        selectedPrioTag = parsed.priorityTag;
        setPrio(selectedPrio, selectedPrioTag);
      }
      if (parsed.hasExplicitSize) {
        selectedSizeTag = parsed.sizeTag;
        setSize(selectedSizeTag);
      }

      const activeTags = [];
      if (selectedPrioTag) activeTags.push(selectedPrioTag);
      if (selectedSizeTag) activeTags.push(selectedSizeTag);

      pendingTask = {
        categoryKey: activeCategory,
        columnIdx: selectedCol,
        title: parsed.title || rawText,
        priority: selectedPrio,
        tags: activeTags
      };

      // Fill modal
      document.getElementById('modalTitleInput').value = pendingTask.title;
      document.getElementById('modalCategorySelect').value = pendingTask.categoryKey;
      document.getElementById('modalColumnSelect').value = pendingTask.columnIdx;

      updateModalBadges();
      triggerHaptic('success');
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function cyclePrioInModal() {
      if (selectedPrio === 0) {
        setPrio(3, '🥎жолтый');
      } else if (selectedPrio === 3) {
        setPrio(5, '🏀красный');
      } else {
        setPrio(0, null);
      }
      updateModalBadges();
      triggerHaptic('tap');
    }

    function cycleSizeInModal() {
      if (!selectedSizeTag) {
        setSize('мелкий');
      } else if (selectedSizeTag === 'мелкий') {
        setSize('большой');
      } else {
        setSize(null);
      }
      updateModalBadges();
      triggerHaptic('tap');
    }

    function updateModalBadges() {
      const prioBadge = document.getElementById('badgePrio');
      if (selectedPrio === 5) {
        prioBadge.className = 'px-2.5 py-0.5 rounded-lg bg-red-500/20 text-red-300 font-bold border border-red-500/40';
        prioBadge.innerText = '🔴 Красный';
      } else if (selectedPrio === 3) {
        prioBadge.className = 'px-2.5 py-0.5 rounded-lg bg-amber-500/20 text-amber-300 font-bold border border-amber-500/40';
        prioBadge.innerText = '🟡 Жолтый';
      } else {
        prioBadge.className = 'px-2.5 py-0.5 rounded-lg bg-zinc-800 text-zinc-400 font-semibold border border-zinc-700/50';
        prioBadge.innerText = 'Без приор.';
      }

      const sizeBadge = document.getElementById('badgeSize');
      if (selectedSizeTag === 'мелкий') {
        sizeBadge.className = 'px-2.5 py-0.5 rounded-lg bg-blue-500/20 text-blue-300 font-bold border border-blue-500/40';
        sizeBadge.innerText = '🔹 Мелкий';
      } else if (selectedSizeTag === 'большой') {
        sizeBadge.className = 'px-2.5 py-0.5 rounded-lg bg-indigo-500/20 text-indigo-300 font-bold border border-indigo-500/40';
        sizeBadge.innerText = '🔷 Большой';
      } else {
        sizeBadge.className = 'px-2.5 py-0.5 rounded-lg bg-zinc-800 text-zinc-400 font-semibold border border-zinc-700/50';
        sizeBadge.innerText = 'Без метки';
      }
    }

    async function handleModalAction(isSubmit) {
      document.getElementById('confirmModal').classList.add('hidden');
      if (!isSubmit) {
        document.getElementById('bannerIcon').innerText = '👆';
        document.getElementById('bannerText').innerText = 'Запись отменена';
        resetSegmentsToDefault();
        return;
      }

      // Gather edits from modal
      pendingTask.title = document.getElementById('modalTitleInput').value.trim();
      pendingTask.categoryKey = document.getElementById('modalCategorySelect').value;
      pendingTask.columnIdx = parseInt(document.getElementById('modalColumnSelect').value, 10);
      pendingTask.priority = selectedPrio;

      const activeTags = [];
      if (selectedPrioTag) activeTags.push(selectedPrioTag);
      if (selectedSizeTag) activeTags.push(selectedSizeTag);
      pendingTask.tags = activeTags;

      document.getElementById('bannerIcon').innerText = '⏳';
      document.getElementById('bannerText').innerText = 'Отправка в TickTick...';

      try {
        if (!navigator.onLine) {
          throw new Error('Offline mode');
        }
        await ticktick.createTask({
          categoryKey: pendingTask.categoryKey,
          columnIdx: pendingTask.columnIdx,
          title: pendingTask.title,
          priority: pendingTask.priority,
          tags: pendingTask.tags
        });
        playSuccessChime();
        triggerHaptic('success');
        document.getElementById('bannerIcon').innerText = '✅';
        document.getElementById('bannerText').innerText = 'Задача сохранена в TickTick!';
      } catch (err) {
        console.warn("Saving to offline queue due to:", err);
        taskQueue.enqueue(pendingTask);
        playBeep(400, 0.08);
        document.getElementById('bannerIcon').innerText = '💾';
        document.getElementById('bannerText').innerText = 'Сохранено в офлайн-очередь';
      }

      resetSegmentsToDefault();
      setTimeout(() => {
        document.getElementById('bannerIcon').innerText = '👆';
        document.getElementById('bannerText').innerText = 'Зажмите категорию и назовите задачу';
      }, 3000);
    }

    // Segment Controllers
    function setCol(id) {
      selectedCol = id;
      for (let i = 0; i <= 4; i++) {
        const btn = document.getElementById('col' + i);
        if (i === id) {
          btn.className = "segment-btn active text-[10px] py-1.5 rounded-lg text-center";
        } else {
          btn.className = "segment-btn text-[10px] py-1.5 rounded-lg text-zinc-400 text-center";
        }
      }
      const names = ['0-Вход', '1-План', '2-Сейчас', '3-Потом', '4-Инфо'];
      document.getElementById('colLabel').innerText = names[id];
    }

    function setPrio(val, tag) {
      selectedPrio = val;
      selectedPrioTag = tag;
      [0, 3, 5].forEach(v => {
        const btn = document.getElementById('prio' + v);
        if (v === val) {
          btn.className = "segment-btn active text-[10px] py-1.5 rounded-lg text-center";
        } else {
          btn.className = "segment-btn text-[10px] py-1.5 rounded-lg text-zinc-400 text-center";
        }
      });
    }

    function setSize(tag) {
      selectedSizeTag = tag;
      const ids = { null: 'sizeNone', 'мелкий': 'sizeSmall', 'большой': 'sizeBig' };
      Object.keys(ids).forEach(k => {
        const btn = document.getElementById(ids[k]);
        const isMatch = (k === 'null' && tag === null) || (k === tag);
        if (isMatch) {
          btn.className = "segment-btn active text-[10px] py-1.5 rounded-lg text-center";
        } else {
          btn.className = "segment-btn text-[10px] py-1.5 rounded-lg text-zinc-400 text-center";
        }
      });
    }

    function resetSegmentsToDefault() {
      setCol(0);
      setPrio(0, null);
      setSize(null);
    }

    // Settings
    function openSettings() {
      document.getElementById('tokenInput').value = ticktick.token;
      document.getElementById('settingsModal').classList.remove('hidden');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
    }

    function saveSettings() {
      const newToken = document.getElementById('tokenInput').value.trim();
      if (newToken) {
        ticktick.setToken(newToken);
        updateTokenStatus();
      }
      closeSettings();
    }

    async function forceAppUpdate() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) {
            await caches.delete(k);
          }
        }
      } catch (e) {}
      window.location.reload(true);
    }

    // PWA Install Prompt handling (Standalone install)
    let deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      const installBtn = document.getElementById('btnInstallPwa');
      if (installBtn) {
        installBtn.style.display = 'inline-flex';
      }
    });

    const installBtn = document.getElementById('btnInstallPwa');
    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          const { outcome } = await deferredInstallPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredInstallPrompt = null;
        } else {
          alert('Чтобы установить приложение как отдельное приложение без адресной строки: откройте меню браузера (три точки ⋮) и нажмите «Установить приложение» (Install app).');
        }
      });
    }

    window.addEventListener('appinstalled', () => {
      const installBtn = document.getElementById('btnInstallPwa');
      if (installBtn) installBtn.style.display = 'none';
      deferredInstallPrompt = null;
    });

    // Register PWA Service Worker with auto-update
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=1.7').then((reg) => {
        reg.onupdatefound = () => {
          const installing = reg.installing;
          installing.onstatechange = () => {
            if (installing.state === 'installed' && navigator.serviceWorker.controller) {
              console.log("New PWA version installed, reloading...");
              window.location.reload();
            }
          };
        };
      }).catch(err => console.log('SW reg fail:', err));
    }
  </script>
</body>
</html>
